uu_csplit = "0.8.0"
uu_split = "0.8.0"
uu_tee = "0.8.0"
uu_test = "0.8.0"
uu_expr = "0.8.0"
grep = "0.4.1"
findutils = "0.8.0"
uu_paste = "0.8.0"
uu_join = "0.8.0"
uu_fold = "0.8.0"
uu_fmt = "0.8.0"
uu_tac = "0.8.0"
glob = "0.3.3"

